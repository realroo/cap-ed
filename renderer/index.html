<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipForge – Video Editor</title>
<style>
:root{--bg:#0b0b0d;--pn:#18181b;--p2:#232328;--ln:#2e2e35;--tx:#e9eaee;--mu:#8a8d99;--ac:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ebf0;--pn:#fff;--p2:#eef0f5;--ln:#d5d8e0;--tx:#15171c;--mu:#667085;--ac:#0891b2;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ebf0;--pn:#fff;--p2:#eef0f5;--ln:#d5d8e0;--tx:#15171c;--mu:#667085;--ac:#0891b2;color-scheme:light}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12.5px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-rows:42px minmax(0,1fr);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button,select{background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);color:#02191c;border:0;font-weight:650}
.top{display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--ln);background:var(--pn)}
.logo{font-weight:800;font-size:15px}.logo u{text-decoration:none;color:var(--ac)}.sp{flex:1}
.top input{background:none;border:0;width:150px;text-align:center}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,.85fr) minmax(280px,.9fr);grid-template-rows:minmax(0,1fr) 250px;gap:6px;padding:6px;min-height:0}
.box{background:var(--pn);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lib{grid-column:1}.det{grid-column:2}.ply{grid-column:3;grid-row:1/3}.tl{grid-column:1/3;grid-row:2}
.nav,.tabsd{display:flex;overflow-x:auto;border-bottom:1px solid var(--ln);flex:none}
.nav button{border:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;color:var(--mu);font-size:11px;padding:8px 4px}.nav i{font-style:normal;font-size:17px}.nav .on{color:var(--ac)}
.tabsd button{border:0;background:none;border-radius:0;padding:10px 14px;color:var(--mu)}.tabsd .on{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
.pad{padding:12px;overflow:auto;flex:1;min-height:0}.mu{color:var(--mu)}
.mg,.tg{display:grid;gap:8px;margin-top:10px}.mg{grid-template-columns:1fr 1fr}.tg{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.mi{position:relative;border-radius:8px;overflow:hidden;background:var(--p2);aspect-ratio:16/10;cursor:pointer;display:grid;place-items:center;font-size:26px}
.mi video,.mi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mi span{position:absolute;left:0;right:0;bottom:0;padding:2px 6px;font-size:11px;background:#000b;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi b{position:absolute;top:4px;right:4px;background:var(--ac);color:#02191c;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px}
.tile{background:var(--p2);border-radius:8px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:1px solid transparent;font-size:11px;text-align:center;padding:4px}.tile i{font-style:normal;font-size:24px}.tile.on{border-color:var(--ac);color:var(--ac)}.tile:hover{border-color:var(--ln)}
textarea{width:100%;min-height:60px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:8px;resize:vertical;margin-bottom:8px}
h5{margin:16px 0 4px;font-size:12.5px}.r{display:grid;grid-template-columns:1fr auto;margin:10px 0;color:var(--mu)}.r input[type=range]{grid-column:1/3;width:100%;accent-color:var(--ac)}.r b{font-weight:500;color:var(--tx)}
.g2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.n{display:flex;flex-direction:column;gap:3px;color:var(--mu)}.n input{background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:5px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips .on{border-color:var(--ac);color:var(--ac)}
.hd{padding:10px 12px;border-bottom:1px solid var(--ln);font-weight:600;flex:none}
.st{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;background:#000;border-radius:4px}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--ln);flex:none}#pl{width:34px;height:34px;border-radius:50%;padding:0}
.tb{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--ln);flex:none}.tb input{width:110px;accent-color:var(--ac)}.tb button{padding:4px 9px}
.tw{display:flex;flex:1;min-height:0}.lb{width:118px;flex:none;border-right:1px solid var(--ln)}.lr{height:44px;display:flex;align-items:center;gap:4px;padding:0 8px;color:var(--mu);border-bottom:1px solid var(--ln)}.lr span{flex:1}.lr button{padding:1px 5px;border:0;background:none}.lr .off{opacity:.3}
.sc{flex:1;overflow:auto;position:relative}.in{position:relative;min-width:100%;user-select:none;touch-action:pan-y}
.rl{height:22px;position:relative;border-bottom:1px solid var(--ln);cursor:pointer}.rl i{position:absolute;top:0;bottom:0;border-left:1px solid var(--ln);padding-left:3px;font-size:10px;color:var(--mu);font-style:normal}
.tk{height:44px;position:relative;border-bottom:1px solid var(--ln)}
.cl{position:absolute;top:4px;height:36px;border-radius:6px;font-size:11px;padding:0 12px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:grab;color:#fff}
.cl.video,.cl.image{background:#0f6b73}.cl.audio{background:#2d8a4e}.cl.text{background:#a8731d}.cl.sel{outline:2px solid #fff;z-index:2}
.hl,.hr{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:#fff4;display:block}.hl{left:0}.hr{right:0}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:5}
.ov{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:20}.ov.on{display:grid}
.ov>div{background:var(--pn);border-radius:14px;padding:20px;max-width:min(92vw,640px);text-align:center}.ov video{max-width:100%;max-height:50vh;border-radius:8px;margin:10px 0}
.pg{height:8px;background:var(--p2);border-radius:4px;overflow:hidden;margin:14px 0 4px;width:300px;max-width:100%}.pg i{display:block;height:100%;width:0;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:270px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
@media(max-width:1000px){body{height:auto;overflow:auto;grid-template-rows:42px auto}main{grid-template-columns:1fr;grid-template-rows:none}.lib,.det,.ply,.tl{grid-column:1;grid-row:auto}.ply{order:-1;height:60vh}.lib,.det{max-height:340px}.tl{height:250px}}
</style></head><body>
<header class="top"><div class="logo">Clip<u>Forge</u></div><div class="sp"></div><input value="Untitled project" aria-label="Project name"><div class="sp"></div><button onclick="toast('Share arrives with accounts. Use Export for now.')">Share</button><button class="pri" onclick="exportV()">Export</button></header>
<main>
<section class="box lib"><div class="nav" id="nav"></div><div class="pad" id="lib"></div><input id="file" type="file" accept="video/*,image/*,audio/*" multiple hidden></section>
<section class="box det" id="rp"></section>
<section class="box ply"><div class="hd">Player</div><div class="st"><canvas id="cv" width="1280" height="720"></canvas></div>
<div class="bar"><button id="pl" onclick="toggle()" aria-label="Play or pause">▶</button><span id="tm">0:00.0 / 0:00.0</span><div class="sp"></div>
<select id="ar" aria-label="Aspect ratio"><option value="1280,720">16:9</option><option value="720,1280">9:16</option><option value="960,960">1:1</option><option value="960,720">4:3</option></select><button onclick="cv.requestFullscreen&&cv.requestFullscreen()" aria-label="Fullscreen">⛶</button></div></section>
<section class="box tl"><div class="tb"><button onclick="undo()" title="Undo (Ctrl+Z)">↶</button><button onclick="redoF()" title="Redo (Ctrl+Y)">↷</button><button onclick="split()" title="Split (S)">✂ Split</button><button onclick="del()" title="Delete">🗑</button><div class="sp"></div><button onclick="fit()">Fit</button><input type="range" id="zm" min="10" max="200" value="60" aria-label="Timeline zoom"></div>
<div class="tw"><div class="lb" id="lb"></div><div class="sc" id="sc"><div class="in" id="in"><div class="rl" id="rl"></div><div class="tk" id="t_text"></div><div class="tk" id="t_over"></div><div class="tk" id="t_video"></div><div class="tk" id="t_audio"></div><div class="ph" id="ph"></div></div></div></div></section>
</main>
<div class="ov" id="ov"><div id="ovc"></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let media=[],clips=[],hist=[],redo=[],uid=0,sel=0,t=0,playing=false,PPS=60,last=performance.now(),AC,XD,onEnd=null,exporting=false,lt='import',dt='basic',TXT='Your text here',lh=0,PXC;const EL=new Set();
const TK={text:{n:'Text'},over:{n:'Overlay'},video:{n:'Main'},audio:{n:'Audio'}},ORD=['text','over','video','audio'];
const PRE={None:'',Warm:'sepia(.35) saturate(1.3)',Cool:'hue-rotate(15deg) saturate(1.2) brightness(1.05)',Mono:'grayscale(1)',Vivid:'saturate(1.7) contrast(1.1)',Fade:'contrast(.85) brightness(1.1) saturate(.8)',Retro:'sepia(.7) contrast(1.1)',Noir:'grayscale(1) contrast(1.4) brightness(.9)',Dream:'brightness(1.1) saturate(1.3) blur(1px)'};
const FXI={Blur:'🌫',Glitch:'📺',Pixelate:'🟦',Vignette:'🌑',Shake:'📳',Mirror:'🪞',Pulse:'💓',Invert:'🔄',Flash:'⚡'},FXL=Object.keys(FXI);
const ANI=['None','Fade','Zoom','Left','Right','Up','Spin','Wipe','Flash'];
const ADJ={Brighten:{b:125},Darken:{b:75},'High contrast':{c:140},Muted:{s:60},Pop:{c:115,s:140},Reset:{b:100,c:100,s:100,hue:0,blur:0,vig:0}};
const TS=[{n:'Default'},{n:'Neon',color:'#22f5ff'},{n:'Gold',color:'#ffd23f'},{n:'Pink',color:'#ff4fa3'},{n:'Big title',size:110,py:0},{n:'Impact',font:'Impact,"Arial Black",sans-serif',size:90}];
const FONTS={Modern:'system-ui,"Segoe UI",sans-serif',Serif:'Georgia,serif',Mono:'ui-monospace,Consolas,monospace',Impact:'Impact,"Arial Black",sans-serif',Script:'"Brush Script MT","Segoe Script",cursive'};
const STK='😀😂😍🥳😎🤯🔥💯❤️👍👏🎉✨⭐🚀💥🎵🎬📸👑💎🌈🍕⚡👀'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
const NAV=[['import','⤓','Import'],['audio','♪','Audio'],['text','T','Text'],['stickers','☺','Stickers'],['effects','✦','Effects'],['transitions','⋈','Transitions'],['captions','▤','Captions'],['filters','◍','Filters'],['adjust','☰','Adjustment']];
const cur=()=>clips.find(c=>c.id==sel),total=()=>clips.reduce((a,c)=>Math.max(a,c.start+c.dur),0);
const fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0'),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function toast(m){const d=$('toast');d.textContent=m;d.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>d.style.opacity=0,2400)}
function initAC(){if(AC)return;AC=new AudioContext();XD=AC.createMediaStreamDestination()}
function hook(c){initAC();const s=AC.createMediaElementSource(c.el);c.g=AC.createGain();s.connect(c.g);c.g.connect(AC.destination);c.g.connect(XD)}
function mk(o){const c={sc:100,px:0,py:0,rot:0,op:100,bl:'source-over',ai:'None',ao:'None',ad:.6,fx:[],vol:1,speed:1,off:0,b:100,c:100,s:100,hue:0,blur:0,vig:0,pre:'',...o};c.id=++uid;
 if(c.m){const m=c.m;if(m.type=='image'){c.el=new Image();c.el.src=m.url}else{const e=document.createElement(m.type);e.src=m.url;e.preload='auto';e.playsInline=true;c.el=e;hook(c)}EL.add(c.el)}
 clips.push(c);return c}
const H=()=>{hist.push(clips.map(c=>({...c})));if(hist.length>60)hist.shift();redo=[]};
function undo(){if(!hist.length)return toast('Nothing to undo');redo.push(clips.map(c=>({...c})));clips=hist.pop();refresh()}
function redoF(){if(!redo.length)return toast('Nothing to redo');hist.push(clips.map(c=>({...c})));clips=redo.pop();refresh()}
/* media + adding */
function load(f){const type=['video','audio','image'].find(k=>f.type.startsWith(k));if(!type)return;const m={name:f.name,type,url:URL.createObjectURL(f),path:window.api?window.api.pathOf(f):'',dur:5};
 if(type=='image'){media.push(m);renderLib();return}const e=document.createElement(type);e.preload='metadata';e.onloadedmetadata=()=>{m.dur=e.duration;media.push(m);renderLib()};e.src=m.url}
$('file').onchange=e=>{initAC();[...e.target.files].forEach(load);e.target.value=''};
document.body.ondragover=e=>e.preventDefault();document.body.ondrop=e=>{e.preventDefault();initAC();[...e.dataTransfer.files].forEach(load)};
function addM(i){H();const m=media[i],tr=m.type=='audio'?'audio':'video',start=tr=='video'?clips.filter(c=>c.track=='video').reduce((a,c)=>Math.max(a,c.start+c.dur),0):t;
 sel=mk({m,type:m.type,track:tr,start,dur:m.dur}).id;refresh()}
function addText(o={}){H();sel=mk({type:'text',track:'text',start:t,dur:3,text:TXT,size:64,font:FONTS.Modern,color:'#ffffff',st:1,box:0,py:Math.round(cv.height*.3),...o}).id;refresh()}
const addSticker=e=>addText({text:e,size:180,st:0,py:0});
const addCap=()=>addText({size:44,st:0,box:1,cap:1,py:Math.round(cv.height*.38)});
const vc=()=>{const c=cur();if(!c||(c.type!='video'&&c.type!='image')){toast('Select a video or photo clip on the timeline first');return null}return c};
function fxT(n){const c=vc();if(!c)return;H();c.fx=c.fx.includes(n)?c.fx.filter(x=>x!=n):[...c.fx,n];refresh()}
function pre(n){const c=vc();if(!c)return;H();c.pre=n=='None'?'':n;refresh()}
function adjP(n){const c=vc();if(!c)return;H();Object.assign(c,ADJ[n]);refresh()}
function setA(k,v){const c=cur();if(!c||c.type=='audio')return toast('Select a video, photo or text clip first');H();c[k]=v;refresh()}
function P(k,v,el){const c=cur();if(!c)return;if(performance.now()-lh>700)H();lh=performance.now();
 if(k=='speed'){const len=c.dur*c.speed;c.speed=v;c.dur=len/v}else c[k]=v;
 if(el){const b=el.parentNode.querySelector('b');if(b)b.textContent=+(+v).toFixed(2)}renderTL()}
function split(){let c=cur()||clips.find(x=>x.track=='video'&&t>x.start&&t<x.start+x.dur);
 if(!c||t<=c.start+.05||t>=c.start+c.dur-.05)return toast('Move the playhead inside a clip to split it');H();
 const n=mk({...c,start:t,dur:c.start+c.dur-t,off:c.off+(t-c.start)*c.speed});c.dur=t-c.start;sel=n.id;refresh()}
function del(){const c=cur();if(!c)return toast('Select a clip to delete');H();clips=clips.filter(x=>x!==c);sel=0;refresh()}
function tg(k,f){TK[k][f]=!TK[k][f];renderTL()}
function refresh(){renderTL();renderProps();renderLib();EL.forEach(e=>{if(e.pause&&!clips.some(c=>c.el===e))e.pause()})}
/* library panel */
function renderLib(){const c=cur(),L=$('lib');$('nav').innerHTML=NAV.map(([k,i,n])=>`<button class="${k==lt?'on':''}" onclick="lt='${k}';renderLib()"><i>${i}</i>${n}</button>`).join('');
 const T=(i,l,on,js)=>`<div class="tile${on?' on':''}" onclick="${js}"><i>${i}</i>${l}</div>`,G=a=>`<div class="tg">${a.join('')}</div>`;let h='';
 if(lt=='import'||lt=='audio'){const au=lt=='audio';h=`<button class="pri" onclick="$('file').accept='${au?'audio/*':'video/*,image/*,audio/*'}';$('file').click()">+ Import</button><p class="mu">${media.length?'Click a file to add it to the timeline.':'Import files or drop them anywhere. Everything stays on your device.'}</p><div class="mg">`+
  media.map((m,i)=>(au?m.type=='audio':true)?`<div class="mi" onclick="addM(${i})">${m.type=='video'?`<video src="${m.url}#t=0.1" muted preload="metadata"></video>`:m.type=='image'?`<img src="${m.url}" alt="">`:'♪'}<b>+</b><span>${esc(m.name)}</span></div>`:'').join('')+'</div>'}
 else if(lt=='captions')h=capUI();else if(lt=='text'){const cp=0;h=`<textarea oninput="TXT=this.value">${esc(TXT)}</textarea><button class="pri" onclick="${cp?'addCap()':'addText()'}">${cp?'Add caption at playhead':'Add text'}</button>`+(cp?'<p class="mu">Captions are timed subtitles on a dark box. Drag the edges on the Text track to set when they show.</p>':'<p class="mu">Or start from a style</p>'+G(TS.map((s,i)=>T('Aa',s.n,0,`addText(TS[${i}])`))))}
 else if(lt=='stickers')h=G(STK.map(e=>T(e,'',0,`addSticker('${e}')`)));
 else if(lt=='effects')h='<p class="mu">Click to switch an effect on or off for the selected clip.</p>'+G(FXL.map(n=>T(FXI[n],n,c&&c.fx.includes(n),`fxT('${n}')`)));
 else if(lt=='transitions')h='<p class="mu">Plays at the start of the selected clip. Fine-tune it under Animation.</p>'+G(ANI.map(n=>T('⋈',n=='Left'?'Slide left':n=='Right'?'Slide right':n=='Up'?'Slide up':n,c&&c.ai==n,`setA('ai','${n}')`)));
 else if(lt=='filters')h=G(Object.keys(PRE).map(n=>T('◍',n,c&&(c.pre||'None')==n,`pre('${n}')`)));
 else h='<p class="mu">Quick looks for the selected clip. Fine controls are in Details › Adjustment.</p>'+G(Object.keys(ADJ).map(n=>T('☰',n,0,`adjP('${n}')`)));
 L.innerHTML=h}
/* details panel */
function renderProps(){const c=cur(),p=$('rp');if(!c){p.innerHTML='<div class="tabsd"><button class="on">Details</button></div><div class="pad mu">Select a clip on the timeline to edit it. Drag a clip to move it and drag its edges to trim.</div>';return}
 const tabs=c.type=='audio'?['basic']:c.type=='text'?['basic','anim']:c.type=='image'?['basic','anim','adj']:['basic','speed','anim','adj'],NM={basic:'Basic',speed:'Speed',anim:'Animation',adj:'Adjustment'};if(!tabs.includes(dt))dt='basic';
 const S=(l,k,a,b,st,u='')=>`<div class="r"><span>${l}</span><span><b>${+(+c[k]).toFixed(2)}</b>${u}</span><input type="range" min="${a}" max="${b}" step="${st}" value="${c[k]}" oninput="P('${k}',+this.value,this)" aria-label="${l}"></div>`;
 const Nn=(l,k)=>`<label class="n"><span>${l}</span><input type="number" value="${Math.round(c[k])}" oninput="P('${k}',+this.value)"></label>`,CH=(a,f)=>`<div class="chips">${a.join('')}</div>`;
 let h=`<div class="tabsd">${tabs.map(x=>`<button class="${x==dt?'on':''}" onclick="dt='${x}';renderProps()">${NM[x]}</button>`).join('')}</div><div class="pad">`;
 if(dt=='basic'){
  if(c.type=='text')h+=`<textarea oninput="P('text',this.value)">${esc(c.text)}</textarea><div class="r"><span>Font</span><select onchange="P('font',this.value)">${Object.entries(FONTS).map(([n,v])=>`<option value='${v}'${c.font==v?' selected':''}>${n}</option>`).join('')}</select></div>`+S('Size','size',16,260,1)+`<div class="r"><span>Color</span><input type="color" value="${c.color}" oninput="P('color',this.value)"></div><label class="r"><span>Outline</span><input type="checkbox" ${c.st?'checked':''} onchange="P('st',this.checked?1:0)"></label><label class="r"><span>Background box</span><input type="checkbox" ${c.box?'checked':''} onchange="P('box',this.checked?1:0)"></label>`+(c.cap?'<button onclick="styleAll()">Apply style to all captions</button>':'');
  h+='<h5>Transform</h5>'+S('Scale','sc',10,400,1,'%')+`<div class="g2">${Nn('X','px')}${Nn('Y','py')}${Nn('Rotate °','rot')}</div>`+S('Opacity','op',0,100,1,'%');
  if(c.type!='text')h+=`<div class="r"><span>Blend</span><select onchange="P('bl',this.value)">${[['Normal','source-over'],['Multiply','multiply'],['Screen','screen'],['Overlay','overlay'],['Lighten','lighten'],['Darken','darken']].map(([n,v])=>`<option value="${v}"${c.bl==v?' selected':''}>${n}</option>`).join('')}</select></div>`;
  if(c.type=='video'||c.type=='audio')h+='<h5>Audio</h5>'+S('Volume','vol',0,2,.05);
